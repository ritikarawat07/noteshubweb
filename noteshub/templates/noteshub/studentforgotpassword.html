<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navbar-color: #0F4C5C;
            --button-color: #0F4C5C;
            --accent-color: #4CAF50;
            --background-color: #F5F3EB;
            --text-color: #222222;
            --success-color: #4CAF50;
            --warning-color: #ff8f00;
            --danger-color: #e74c3c;
            --light-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            background: var(--light-color);
            border: 1px solid rgba(15, 76, 92, 0.1);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(15, 76, 92, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--text-color);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-color);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--button-color);
            box-shadow: 0 0 0 3px rgba(27, 111, 130, 0.1);
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .alert {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--button-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(15, 76, 92, 0.4);
            background: var(--navbar-color);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .footer a {
            color: var(--button-color);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .step.active {
            background: var(--button-color);
            color: white;
        }

        .step.inactive {
            background: #e0e0e0;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Password Recovery</h1>
            <p>Verify your identity using your academic details</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1-indicator">1</div>
            <div class="step inactive" id="step2-indicator">2</div>
        </div>

        <div class="alert" id="alert"></div>

        <!-- Step 1: Verify Identity -->
        {% if not reset_stage %}
        <form method="post" action="{% url 'student_forgot_password' %}">
            {% csrf_token %}
            {% if error %}
            <div class="alert" style="display: block;" class="error">
                {{ error }}
            </div>
            {% endif %}
            <div class="form-group">
                <label for="rollNumber">Roll Number *</label>
                <input type="text" id="roll_no" name="roll_no" placeholder="Enter your roll number" required>
                <div class="error-message" id="rollNumberError"></div>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob" required>
                <div class="error-message" id="dobError"></div>
            </div>

            <button type="submit" class="btn">Verify Identity</button>
        </form>

        <!-- Step 2: Reset Password -->
        {% else %}
        <form method="post" action="{% url 'student_forgot_password' %}">
            {% csrf_token %}
            {% if error %}
            <div class="alert" style="display: block;" class="error">
                {{ error }}
            </div>
            {% endif %}
            <div class="form-group">
                <label for="newPassword">New Password *</label>
                <input type="password" id="password" name="password" placeholder="Enter new password" required>
                <div class="error-message" id="newPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                <div class="error-message" id="confirmNewPasswordError"></div>
            </div>

            <button type="submit" class="btn">Reset Password</button>
        </form>
        {% endif %}

        <div class="footer">
            Remember your password? <a href="{% url 'studentlogin' %}">Login here</a>
        </div>
    </div>

    <script>
        let verificationComplete = false;

        function handleVerify(event) {
            event.preventDefault();
            clearErrors();

            const rollNumber = document.getElementById('rollNumber').value.trim();
            const dob = document.getElementById('dob').value;

            let isValid = true;

            if (!rollNumber) {
                showError('rollNumberError', 'Roll number is required');
                isValid = false;
            }

            if (!dob) {
                showError('dobError', 'Date of birth is required');
                isValid = false;
            }

            if (isValid) {
                // Simulate verification
                if (rollNumber === 'STU001' && dob === '2000-01-15') {
                    verificationComplete = true;
                    document.getElementById('verifyForm').style.display = 'none';
                    document.getElementById('resetForm').style.display = 'block';
                    document.getElementById('step1-indicator').classList.remove('active');
                    document.getElementById('step1-indicator').classList.add('inactive');
                    document.getElementById('step2-indicator').classList.remove('inactive');
                    document.getElementById('step2-indicator').classList.add('active');
                    showAlert('Identity verified! Please set your new password.', false);
                } else {
                    showAlert('Invalid roll number or date of birth. Please try again.', true);
                }
            }
        }

        function handleReset(event) {
            event.preventDefault();
            clearErrors();

            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            let isValid = true;

            if (!newPassword || newPassword.length < 6) {
                showError('newPasswordError', 'Password must be at least 6 characters');
                isValid = false;
            }

            if (newPassword !== confirmNewPassword) {
                showError('confirmNewPasswordError', 'Passwords do not match');
                isValid = false;
            }

            if (isValid) {
                showAlert('Password reset successfully! Redirecting to login...', false);
                setTimeout(() => {
                    window.location.href = '{% url "studentlogin" %}';
                }, 2000);
            }
        }

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showAlert(message, isError = false) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.style.display = 'block';
            if (isError) {
                alert.classList.add('error');
            } else {
                alert.classList.remove('error');
            }
        }

        function clearErrors() {
            const errors = document.querySelectorAll('.error-message');
            errors.forEach(error => error.style.display = 'none');
        }
    </script>
</body>

</html>
